
services:
  backend:
    image: httpd:2.4
    volumes:
      - ./apache:/usr/local/apache2/htdocs:ro

  cache:
    image: nginx:1.26
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend

  controller:
    image: node:24-alpine
    working_dir: /app
    volumes:
      - ./client:/app:ro
    command: ["node", "server.js"]
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - cache

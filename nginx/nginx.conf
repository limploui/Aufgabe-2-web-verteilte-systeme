events {}

http {
    proxy_cache_path /var/cache/nginx
        levels=1:2
        keys_zone=cpdos_cache:10m
        max_size=100m
        inactive=10m;

    server {
        listen 80;
        server_name localhost;

        large_client_header_buffers 4 32k;

        location ~ ^/(index\.html|browser\.js)$ {
            proxy_pass http://backend:80;
            proxy_cache off;
}

        location / {
            proxy_pass http://backend:80;

            proxy_cache cpdos_cache;
            proxy_cache_key "$scheme$host$request_uri";

            proxy_cache_valid 200 20s;
            proxy_cache_valid 400 20s;

            add_header X-Cache-Status
                $upstream_cache_status always;

            add_header X-Debug-Cache-Key "$scheme$host$request_uri" always;
}
    }
}
